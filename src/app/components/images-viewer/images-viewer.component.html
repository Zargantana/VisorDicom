<div class="d-flex slab-flex-1 flex-column m-0 p-0" #mainDiv>

  <!-- Sin selector de estudios sobre el visor (2026-09-27): el selector vive en la pantalla de carga ("Estudios
       encontrados" en la barra vuelve a ella). Solo queda el aviso mientras se siguen leyendo ficheros. -->
  @if (!readEnded) {
    <div class="d-flex flex-row align-items-center m-2 p-1 blink_me"><i class="fa-solid fa-truck-loading me-2"></i> <span>{{'viewer.loading' | t}}</span></div>
  }
  @if (selectedClassifier && listviewerSelected()) {
    <list-image-viewer class="d-flex flex-row slab-flex-1 m-0 p-0" #listviewer [classifier]="selectedClassifier"></list-image-viewer>
  }
  @if (selectedClassifier && scrollviewerSelected()) {
    <scroll-image-viewer class="d-flex flex-row slab-flex-1 m-0 p-0" #scrollviewer [classifier]="selectedClassifier"></scroll-image-viewer>
  }
</div>
