<div class="tracker d-flex flex-column m-0 p-0">
    <div class="d-flex justify-content-between align-items-baseline">
        <small class="tracker-name text-truncate">{{theDICOMFile?.file?.name}}</small>
        <small class="tracker-pct ms-2 text-nowrap">{{pct}}%</small>
    </div>
    <div class="progress tracker-progress" role="progressbar" [attr.aria-valuenow]="pct" aria-valuemin="0" aria-valuemax="100">
        <div class="progress-bar" [style.width.%]="pct"></div>
    </div>
</div>
